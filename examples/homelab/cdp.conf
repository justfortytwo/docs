# Internal automation endpoint. Never publish this port or route it via Traefik.
server {
  listen 9223;
  server_name _;

  location / {
    proxy_pass http://127.0.0.1:9222;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:9223;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Discovery must advertise an address reachable from the other container.
    sub_filter_types application/json;
    sub_filter 'ws://localhost:9223/' 'ws://chromium:9223/';
    sub_filter_once off;
    proxy_read_timeout 3600s;
  }
}
